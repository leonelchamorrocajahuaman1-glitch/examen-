# Base de datos PostgreSQL para desarrollo local.
# Uso: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: neon-liquor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon_dev_password
      POSTGRES_DB: neon_liquor
    ports:
      - "5432:5432"
    volumes:
      - neon_liquor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -d neon_liquor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neon_liquor_pgdata:
